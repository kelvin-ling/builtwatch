  Amazon Bedrock

  User Guide

  Document history for the Amazon Bedrock User Guide

  The following table describes important changes in each release of Amazon Bedrock. For notification

  about updates to this documentation, you can subscribe to an RSS feed.

  Change

  Description

  Date

  Added Claude Fable 5.1 and Claude Mythos 5.1

  Added model cards for

  Claude Fable 5.1

  and

  Claude Mythos 5.1

  . Updated the Adaptive thinking, Extended thinking, Tool use, and Prompt caching pages. Added a new

  Thinking block binding (beta)

  topic.

  September 1, 2026

  Corrected Claude Sonnet 5 thinking guidance: adaptive thinking is on by default and can be disabled

  Corrected the Reasoning entry on the

  Claude Sonnet 5

  model card, which incorrectly stated that adaptive thinking is always on and cannot be disabled. On
  Claude Sonnet 5, adaptive thinking is on by default — including for requests that omit the

  thinking

  field — and can be turned off by passing

  "thinking":

  {

  "type": "disabled"}

  . Added Claude Sonnet 5 to the supported models table on the

  Adaptive thinking

  topic, and added guidance covering the default-on behavior change from Claude Sonnet 4.6, the fact that
  only the explicit

  disabled

  thinking type turns thinking off (omitting the

  thinking

  field selects adaptive thinking, and

  budget_tokens

  is not supported on this model), that thinking tokens are billed as output tokens, and the need to revisit

  max_tokens

  for workloads migrated from Claude Sonnet 4.6.

  August 24, 2026

  Fixed Anthropic Messages API code samples and switched model-card OpenAI-SDK samples to bedrock-runtime

  Fixed the Anthropic Messages API Python sample on the

  Overview

  page, which previously used

  anthropic.Anthropic()

  with no base URL and failed with a validation exception. Every Anthropic Messages API Python sample
  now uses the plain

  Anthropic

  client from the Anthropic SDK, targets the

  bedrock-runtime

  endpoint''s

  /anthropic

  route directly with

  base_url="https://bedrock-runtime.

  {

  region}.amazonaws.com/anthropic"

  , and authenticates with a short-term Amazon Bedrock bearer token generated by

  aws-bedrock-token-generator

  ''s

  provide_token()

  . Updated the Sample Code section of every Anthropic model card that supports

  bedrock-runtime

  (Claude Opus 5, Opus 4.8, Opus 4.7, Sonnet 5, Haiku 4.5, and Fable 5) to use this pattern with the model''s
  Global inference ID, and updated the corresponding

  pip install

  line to

  pip install -U anthropic aws-bedrock-token-generator

  . Updated the same sample on the

  Quickstart

  page, the

  Messages API

  topic, and the

  Tool use

  reference topic. Reordered the code sample tabs on the Messages API topic to lead with

  bedrock-runtime

  variants (Anthropic SDK, boto3, AWS CLI, curl) and moved the

  bedrock-mantle

  curl tab to the end. Repointed the

  OPENAI_BASE_URL

  environment variable on 49 non-Anthropic model cards (OpenAI, Mistral AI, DeepSeek, Google, Meta, Qwen,
  MiniMax, NVIDIA, Moonshot AI, Z.AI, Writer, xAI) from the

  bedrock-mantle

  /v1

  route to the

  bedrock-runtime

  /openai/v1

  route (

  https://bedrock-runtime.

  {

  region}.amazonaws.com/openai/v1

  ) so the Responses API and Chat Completions API samples in the Sample Code section run against

  bedrock-runtime

  by default. The

  bedrock-mantle

  endpoint continues to be fully supported and pages that document mantle-only features (Web Search, Projects,
  Workspaces, Chat Completions on mantle, the mantle Responses API page) still show

  bedrock-mantle

  URLs.

  August 19, 2026

  Updated endpoint guidance to recommend the bedrock-runtime endpoint

  Updated the endpoint and API guidance across the Amazon Bedrock User Guide to recommend the

  bedrock-runtime

  endpoint for new applications, including for OpenAI- and Anthropic-compatible workloads. Changes include
  reordered quickstart tabs and code samples on the

  Overview

  and

  Quickstart

  pages, reordered endpoint and API guidance on the

  Endpoints

  ,

  APIs

  , and

  Build

  pages, reordered Programmatic Access sections in model cards, retitled the

  Responses API

  and

  Chat Completions API

  pages that document the

  bedrock-mantle

  variants, and added cross-reference tips on the

  Projects

  and

  Workspaces

  pages. The

  bedrock-mantle

  endpoint continues to be fully supported and existing applications that use it do not need to change.

  August 15, 2026

  Follow-up bedrock-runtime positioning updates in Quickstart and model cards

  Follow-up updates continuing the

  bedrock-runtime

  positioning work. Reordered the code sample tabs on the

  Quickstart

  page to lead with the Messages API, followed by the Responses, Chat Completions, Converse, and Invoke
  APIs. The Messages API tab now targets the

  bedrock-runtime

  endpoint using the

  AnthropicBedrock

  client (AWS SigV4 auth), so all Quickstart tabs consistently use

  bedrock-runtime

  . Updated the Quickstart code samples to use Claude Opus 5 for Anthropic and GPT-5.6 Sol for OpenAI.
  Added a suggestion callout under the Model Details section of every model card that supports

  bedrock-runtime

  , recommending the

  bedrock-runtime

  endpoint for new applications. Added Daybreak Red: GPT-5.6 Cyber and Daybreak Blue: GPT-5.6 Sol to the
  OpenAI row of the

  Models at a glance

  summary table.

  August 15, 2026

  AgentCore Memory integration for Amazon Bedrock agentic retrieval

  Agentic retrieval on fully managed Amazon Bedrock knowledge bases now integrates with

  Amazon Bedrock AgentCore Memory

  . Use the

  memoryConfiguration

  field on

  AgenticRetrieveStream

  to configure memory. You can restore an earlier session from short-term memory, let the agent retrieve
  memory records from long-term memory, or both. For more information, see

  Use agentic retrieval to query a knowledge base

  .

  August 14, 2026

  IAM principal cost allocation now supported on the bedrock-mantle endpoint

  Amazon Bedrock now supports cost allocation by IAM principal (users and roles) for inference requests
  made through the

  bedrock-mantle

  endpoint, extending the capability previously available for

  bedrock-runtime

  . Tag IAM users and roles with attributes such as team, project, or cost center, activate them as cost
  allocation tags, and analyze

  bedrock-mantle

  inference costs by those tags in AWS Cost Explorer or at the line-item level in AWS Cost and Usage Report
  2.0 (CUR 2.0). Available in all AWS Regions where the

  bedrock-mantle

  endpoint is available. For more information, see

  IAM principal attribution in Amazon Bedrock

  .

  August 11, 2026

  Amazon Bedrock Agents Classic is no longer open to new customers.

  Amazon Bedrock Agents (now Amazon Bedrock Agents Classic) is no longer open to new customers. For capabilities
  similar to Bedrock Agents Classic, explore

  Amazon Bedrock AgentCore

  . Existing customers can continue to use the service as normal. For more information, see

  Amazon Bedrock Agents Classic availability change

  .

  July 30, 2026

  Amazon Bedrock Agents Classic availability change

  Amazon Bedrock Agents (launched November 2023) is now Amazon Bedrock Agents Classic and will no longer
  be open to new customers starting on July 30, 2026. If you would like to use Bedrock Agents Classic,
  sign up prior to that date. Existing customers can continue to use the service as normal. For more information,
  see

  Amazon Bedrock Agents Classic maintenance mode

  .

  June 30, 2026

  Updated requests-per-minute (RPM) quota guidance

  Clarified RPM quota behavior across Amazon Bedrock endpoints. The

  bedrock-mantle

  endpoint does not expose per-model RPM quotas; throttling is governed by token-based quotas. On the

  bedrock-runtime

  endpoint, RPM quotas are model-specific — some models, including Anthropic Claude Opus 4.7 and Claude
  Opus 4.8, are not subject to an RPM quota. For models that do have an RPM quota, see the Service Quotas
  console.

  May 27, 2026

  Quotas for the bedrock-runtime endpoint

  Added a dedicated page that describes the per-model token quotas that govern inference traffic to the

  bedrock-runtime

  endpoint and points to related quotas for custom inference profiles, batch inference, and Provisioned
  Throughput.

  May 27, 2026

  Quotas for the bedrock-mantle endpoint

  Documented the per-model input and output token quotas that govern inference traffic to the

  bedrock-mantle

  endpoint, including the default values for Anthropic Claude Opus 4.7, the request evaluation order,
  the differences from

  bedrock-runtime

  quotas, and how to request quota increases through AWS Support.

  May 27, 2026

  Token counting on the bedrock-mantle endpoint

  Documented how to count input tokens through the Anthropic

  count_tokens

  path on the

  bedrock-mantle

  endpoint, including for Claude models that are not supported by

  CountTokens

  on

  bedrock-runtime

  .

  May 26, 2026

  Fully managed knowledge bases with agentic retrieval

  Amazon Bedrock Knowledge Bases now offers fully managed knowledge bases, where Amazon Bedrock manages
  the storage, indexing, and retrieval infrastructure for you. Fully managed knowledge bases also support
  agentic retrieval with the AgenticRetrieveStream API, which uses a foundation model to decompose complex
  queries into sub-queries and iteratively retrieve relevant information.

  March 2, 2026

  Converse API support for batch inference

  You can now use the Converse API format for batch inference input data. When creating a batch inference
  job, set the model invocation type to Converse to use a consistent request format across models.

  February 27, 2026

  New feature

  Added support for fine-tuning open-weight models using OpenAI-compatible APIs. You can now create, monitor,
  and manage reinforcement fine-tuning jobs for open-weight models through familiar OpenAI SDK endpoints,
  including Files API, fine-tuning jobs APIs, and inference APIs.

  February 17, 2026

  Updated list of models supported for service tiers

  Updated list of models supported for priority and flex service tiers

  December 31, 2025

  New feature

  Amazon Bedrock Data Automation now supports blueprint instruction optimization for documents. Improve
  Data Automation custom output accuracy by providing example content assets with ground truth labels,
  enabling you to achieve production-ready accuracy for documents in minutes without model training.

  December 18, 2025

  New managed policies

  Amazon Bedrock added the following managed IAM policies for Amazon Bedrock Mantle: AmazonBedrockMantleFullAccess,
  AmazonBedrockMantleReadOnly, AmazonBedrockMantleInferenceAccess. Amazon Bedrock Mantle provides OpenAI-compatible
  API endpoints for model inference.

  December 3, 2025

  New feature

  Amazon Bedrock now supports OpenAI compatible API endpoints, including Responses API and Chat Completions
  API. These endpoints enable asynchronous inference for long-running workloads, stateful conversation
  management without manual history passing, and simplified tool use integration for agentic workflows.
  Migrate existing applications with minimal code changes by updating your base URL and API key.

  December 3, 2025

  New feature

  Added new reinforcement fine-tuning to improve foundation model performance through feedback signals.

  December 3, 2025

  New feature

  Added new "Reserved" service tier for Bedrock inference.

  November 26, 2025

  New model

  Amazon Bedrock now supports Anthropic Claude Opus 4.5.

  November 24, 2025

  New feature

  You can now share guardrails across accounts within an AWS organization.

  November 21, 2025

  New feature

  Amazon Bedrock Data Automation now supports synchronous invocation.

  November 20, 2025

  Updated model support for custom model import

  Custom model import now supports OpenAI GPT-OSS models.

  November 19, 2025

  Enhanced coding use case support for Standard tier

  Amazon Bedrock Guardrails Standard tier now provides enhanced support for coding use cases. Content

  filters, prompt attacks, and denied topics have been upgraded to better handle

  code-related prompts and responses without requiring changes to existing configurations.

  Added comprehensive code domain support documentation and prompt leakage detection for

  Standard tier.

  November 19, 2025

  Updated feature

  Added new service tiers priority and flex for on demand inference

  November 18, 2025

  Region expansion

  Amazon Bedrock is now supported in Africa (Cape Town), Asia Pacific (New Zealand), Canada West (Calgary),
  Mexico (Central), and Middle East (Bahrain).

  November 18, 2025

  Updated feature

  Added note about using ''english'' dictionary instead of ''simple'' dictionary for PostgreSQL text search
  in Aurora Knowledge Base integration.

  October 31, 2025

  Model in legacy status

  Anthropic Claude 3.7 Sonnet is now in legacy status. Migrate to Claude Sonnet 4.5

  before April 28, 2026.

  October 30, 2025

  New feature

  Four new Stability AI Image Services (outpaint and upscale) are now available with Amazon Bedrock.

  October 28, 2025

  Updated feature

  You can now use a previously customized model (fine-tuned or distilled) as the base model for further
  customization.

  October 16, 2025

  New model

  You can now use Anthropic Claude Haiku 4.5 with Amazon Bedrock.

  October 15, 2025

  New feature

  Access to all Amazon Bedrock foundation models is now enabled by default with the correct IAM permissions.

  October 15, 2025

  Region expansion

  Amazon Bedrock Guardrails is now generally available with cross-region inference in 5 additional regions:
  Asia Pacific (Bangkok), Asia Pacific (Kuala Lumpur), Asia Pacific (Taipei), Israel (Tel Aviv), and Middle
  East (Dubai).

  October 9, 2025

  Updated managed policy

  Amazon Bedrock updated the AmazonBedrockFullAccess managed policy

  to enable access to all serverless foundation models by default.

  October 7, 2025

  Updated model support for batch inference

  Batch inference now supports DeepSeek V3.1, Qwen3 32B (dense), Qwen3 235B A22B 2507, Qwen3-Coder-30B-A3B-Instruct,
  and Qwen3 Coder 480B A35B Instruct.

  October 3, 2025

  New model

  You can now use Cohere Cohere Embed v4 with Amazon Bedrock.

  October 2, 2025

  Updated model support

  You can now import Qwen3 models with model import.

  September 30, 2025

  Region expansion

  Cohere Cohere Rerank 3.5 model is now available in US East (N. Virginia).

  September 30, 2025

  Region expansion

  Amazon Bedrock Guardrails is now available generally in Asia Pacific (Melbourne) and with

  cross-Region inference.

  September 29, 2025

  New model

  You can now use Anthropic Claude Sonnet 4.5 with Amazon Bedrock.

  September 29, 2025

  Region expansion

  Amazon Bedrock is now available in Asia Pacific (Thailand), Asia Pacific (Taipei), Asia Pacific (Malaysia),

  Middle East (UAE), and Israel (Tel Aviv).

  September 26, 2025

  New feature

  Amazon Bedrock Flows now supports Flows trace enhancements and DoWhile loop node functionality.

  September 26, 2025

  New model

  You can now use Anthropic Claude Sonnet 4.5 with Amazon Bedrock.

  September 25, 2025

  New model

  Stability AI Image Services are now available with Amazon Bedrock.

  September 18, 2025

  New model

  Meta Llama 3.3 70B Instruct is now available for fine-tuning and

  continued pretraining is now available with Amazon Bedrock.

  September 15, 2025

  New Region support for Guardrails

  Amazon Bedrock Guardrails is now supported in Asia Pacific (Jakarta).

  September 11, 2025

  New tutorial

  TwelveLabs Marengo Embed 2.7 now supports the

  InvokeModel

  API.

  September 9, 2025

  New tutorial

  You can now use the

  bedrock:bearerTokenType

  condition key with the

  bedrock:CallWithBearerToken

  action.

  September 4, 2025

  New tutorial

  You can familiarize yourself with Amazon Bedrock resource creation by trying out a tutorial to easily
  set up a mortgage Amazon Bedrock flow with CloudFormation templates.

  September 2, 2025

  New feature

  The OpenAI batch API is now supported.

  August 27, 2025

  Region expansion

  Amazon Bedrock data automation is now available in AWS GovCloud (US-West).

  August 25, 2025

  New languages

  Amazon Bedrock data automation now supports data extraction from documents in Portuguese, French, Italian,
  Spanish, and German.

  August 25, 2025

  New feature

  You can now estimate token count for some models.

  August 21, 2025

  Region expansion for model

  TwelveLabs TwelveLabs Pegasus 1.2 is now supported in US East (N. Virginia) and Asia Pacific (Seoul).

  August 14, 2025

  Added model support for Amazon Bedrock Guardrails

  Amazon Bedrock Guardrails is now supported in US West (N. California).

  August 11, 2025

  New models

  You can now use OpenAI gpt-oss-20b and gpt-oss-120b  with Amazon Bedrock.

  August 5, 2025

  New feature

  Amazon Bedrock Guardrails now supports Automated Reasoning checks to validate the accuracy of foundation
  model responses.

  August 5, 2025

  Region expansion

  Amazon Bedrock is now supported in Asia Pacific (Melbourne).

  July 31, 2025

  New model

  You can now use Anthropic Claude Opus 4.1 with Amazon Bedrock.

  July 31, 2025

  Added model support for batch inference

  Batch inference now supports the US Amazon Nova Premier inference profile.

  July 29, 2025

  Region expansion

  Amazon Bedrock is now supported in US West (N. California).

  July 28, 2025

  New feature

  Amazon Bedrock data automation now supports DOC/DOCX and H.265 file types

  July 28, 2025

  Region expansion

  Amazon Bedrock data automation is now available in Europe (Frankfurt), Europe (London), Europe (Ireland),
  Asia Pacific (Mumbai), and Asia Pacific (Sydney).

  July 16, 2025

  New feature

  You can now import SageMaker AI-trained Amazon Nova models into Amazon Bedrock as custom models.

  July 16, 2025

  New feature

  You can now deploy custom models for on-demand inference in Amazon Bedrock. This feature allows you
  to deploy custom models for pay-per-token inference without provisioned throughput.

  July 16, 2025

  New models

  You can now use TwelveLabs TwelveLabs Pegasus 1.2 and TwelveLabs Marengo Embed 2.7 with Amazon Bedrock.

  July 15, 2025

  Region expansion

  You can now use Anthropic Claude 3.7 Sonnet in AWS GovCloud (US-West).

  July 7, 2025

  New managed policies

  Amazon Bedrock added the following managed IAM policies: AmazonBedrockLimitedAccess, AmazonBedrockMarketplaceAccess.

  July 7, 2025

  New feature

  Amazon Bedrock now supports the creation of API keys for easy authentication to make calls to the Amazon
  Bedrock API.

  July 7, 2025

  Region expansion for intelligent prompt routing

  Intelligent prompt routing is now supported in AWS GovCloud (US-West) and AWS GovCloud (US-East).

  July 3, 2025

  Added model support for batch inference

  Batch inference is now supported by the Meta Llama 4 Scout 17B Instruct and Llama 4 Maverick 17B Instruct
  models.

  July 3, 2025

  Region expansion

  Prompt management is now supported in Europe (Milan), Europe (Spain), Asia Pacific (Hyderabad), and
  Asia Pacific (Osaka).

  July 1, 2025

  Region expansion

  Amazon Bedrock Flows is now supported in Europe (Milan), Europe (Spain), Asia Pacific (Hyderabad), and
  Asia Pacific (Osaka).

  July 1, 2025

  Region expansion for Amazon Bedrock Knowledge Bases

  Amazon Bedrock Knowledge Bases is now supported in the AWS Regions  Asia Pacific (Hyderabad), Asia Pacific
  (Osaka),

  Europe (Milan), and Europe (Spain).

  June 26, 2025

  New feature

  Amazon Bedrock Guardrails supports safeguard tiers, which give you performance and language options
  for content filters (text), prompt attacks, and denied topic policies.

  June 23, 2025

  New feature

  (Preview) Run code directly in your Amazon Bedrock flow with inline code nodes.

  June 19, 2025

  New feature

  (Preview) Run Amazon Bedrock flows for longer durations with flow executions.

  June 19, 2025

  New tutorial

  Added a tutorial for creating a simple Amazon Bedrock agent.

  May 28, 2025

  New models available

  You can know use Claude Sonnet 4 and Claude Opus 4 with Amazon Bedrock.

  May 22, 2025

  New feature

  Amazon Bedrock data automation now supports custom output for videos.

  May 19, 2025

  Added video blueprint support

  BDA now supports blueprints for videos.

  May 16, 2025

  New feature

  Amazon Bedrock Guardrails now supports cross-Region inference.

  May 13, 2025

  Added model support for custom model import

  Custom model import now supports Qwen2, Qwen2.5, Qwen2-VL, Qwen2.5-VL.

  May 12, 2025

  New feature

  Amazon Bedrock data automation now supports custom blueprints for audio files.

  May 5, 2025

  New model

  You can now use Meta Llama 4 Scout 17B Instruct and Llama 4 Maverick 17B Instruct with Amazon Bedrock.

  April 28, 2025

  New model

  You can now use Writer Palmyra X4 and Writer Palmyra X5 with Amazon Bedrock.

  April 28, 2025

  New feature

  You can now reference images and documents stored in Amazon S3 when using the InvokeModel and Converse
  APIs with Amazon Nova Lite and Amazon Nova Pro. Inclusion of images, documents, and videos stored in
  S3 with these APIs is also now supported with inference profiles.

  April 25, 2025

  New feature

  Amazon Bedrock data automation now supports modality routing and hyperlink support

  April 25, 2025

  General release

  Intelligent prompt routing is now generally available with Amazon Bedrock.

  April 22, 2025

  New feature

  Amazon Bedrock Knowledge Bases now supports additional user-provided metadata field for Amazon Aurora
  and enhanced

  hybrid search capabilities for MongoDB vector stores.

  April 10, 2025

  Region expansion for custom model import

  Custom model import is now supported in Europe (Frankfurt).

  April 9, 2025

  New model

  You can now use Pixtral Large (25.02) with Amazon Bedrock.

  April 8, 2025

  New feature

  New options for handling harmful content detected by Amazon Bedrock.

  April 7, 2025

  Region expansion for batch inference

  Batch inference now supports Amazon Nova Lite, Amazon Nova Pro, and Amazon Nova Micro in AWS GovCloud
  (US-West).

  April 4, 2025

  Region expansion for batch inference

  Batch inference now supports Anthropic Claude Claude 3.5 Sonnet V2 in Asia Pacific (Mumbai), Asia Pacific
  (Hyderabad), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Seoul), Asia Pacific (Osaka)
  and Amazon Titan Text Embeddings V2 in Europe (Stockholm), Europe (Milan), and Europe (Spain).

  April 2, 2025

  Added model support for Provisioned Throughput

  Provisioned Throughput now supports Amazon Nova Canvas, in addition to 24k context windows for Amazon
  Nova Lite, Amazon Nova Micro, and Amazon Nova Pro.

  April 2, 2025

  New feature

  Amazon Bedrock Knowledge Bases now supports OpenSearch Managed Clusters as a vector store when creating
  a knowledge base.

  March 27, 2025

  New feature

  You can now use flow templates to get started with Amazon Bedrock Flows.

  March 27, 2025

  Feature moved

  Amazon Bedrock Studio, renamed to Amazon Bedrock in Sagemaker Unified Studio, is now available in

  Amazon SageMaker Unified Studio

  .

  March 25, 2025

  New feature

  You can now enforce Amazon Bedrock model inference requests to use specific guardrails through a

  new IAM condition key.

  March 18, 2025

  Region expansion

  Amazon Bedrock is now supported in Europe (Milan) and Europe (Spain).

  March 14, 2025

  Support expanded for feature

  Amazon Bedrock Knowledge Bases now supports cross-region inference with structured data retrieval.

  March 13, 2025

  New feature

  Amazon Bedrock now supports configured prompt routers in preview with intelligent prompt

  routing.

  March 13, 2025

  Model support expanded for feature

  Provisioned Throughput now supports Llama 3.2 1B Instruct, Llama 3.2 3B Instruct,

  Llama 3.2 11B Instruct, and Llama 3.2 90B Instruct in US West (Oregon).

  March 13, 2025

  Added model support for Knowledge Bases

  Amazon Bedrock Knowledge Bases now supports reasoning models Deepseek-R1 and Anthropic Claude 3.7 Sonnet.

  March 12, 2025

  New model

  You can now use DeepSeek-R1 with Amazon Bedrock.

  March 10, 2025

  New feature

  You can now configure an Amazon Bedrock Agent to complete tasks with computer use tools.

  March 10, 2025

  General release

  GraphRAG for Amazon Bedrock Knowledge Bases is now generally available with additional capabilities.

  March 7, 2025

  General release

  Amazon Bedrock data automation is now available with increased accuracy and CRIS

  March 3, 2025

  Region expansion

  Amazon Bedrock is now supported in Europe (Stockholm).

  February 27, 2025

  New feature

  You can now use Amazon Bedrock session management APIs to manage state for generative AI

  applications built with open-source frameworks.

  February 27, 2025

  New model

  You can now use Claude 3.7 Sonnet with Amazon Bedrock.

  February 24, 2025

  Region expansion

  Amazon Bedrock is now supported in Asia Pacific (Hyderabad) and Asia Pacific (Osaka).

  February 21, 2025

  New model

  You can '
