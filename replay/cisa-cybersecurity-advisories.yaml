  Advisory Definitions

  Click the linked definitions to see a filtered list of each advisory type.

  Alert

  : Provides succinct information on recent, ongoing, or high-impact cyber threats, plus associated mitigations,
  workarounds, and/or detections. Alerts typically include information on newly exploited or disclosed
  vulnerabilities, newly discovered cyber threat campaigns, severe denial-of-service events or widespread
  outages, or emerging threat activity related to current world events.

  Use when:

  You need immediate awareness of a high-priority threat or vulnerability and a rapid response.

  Cybersecurity Advisory

  :  Provides detailed information on cyber threats, including threat actor tactics, techniques, and procedures
  and indicators of compromise, along with recommended actions for detection, mitigation, and response.
  Advisories typically cover recent or ongoing cyber threats, state-sponsored cyber activity, cyber trends,
  and/or actionable insights gleaned from incident response or red team engagements.

  Use when:

  You need deep technical insight and guidance on how to defend against or respond to a specific threat.

  Malware Analysis Report

  :

  Provides comprehensive details of malware samples, including a description of the malware’s functionality,
  as well as malware metadata and detection signatures.

  Use when:

  You need in-depth understanding of how a piece of malware works and how to detect or defend against
  it.'
