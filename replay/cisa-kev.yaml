  Known Exploited Vulnerabilities Catalog

  For the benefit of the cybersecurity community and network defenders—and to help every organization
  better manage vulnerabilities and keep pace with threat activity—CISA maintains the authoritative source
  of vulnerabilities that have been exploited in the wild. Organizations should use the KEV catalog as
  an input to their vulnerability management prioritization framework. Learn more about

  how to use the KEV catalog

  in your organization.

