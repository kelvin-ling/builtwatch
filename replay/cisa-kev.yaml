  Google | Chromium V8

  CVE-2026-85046

  Google Chromium V8 Type Confusion Vulnerability:

  Google Chromium V8 contains a type confusion vulnerability that allows a remote attacker to execute
  arbitrary code inside the sandbox via a crafted HTML page. This vulnerability could affect multiple
  web browsers that utilize Chromium, including, but not limited to, Google Chrome, Microsoft Edge, and
  Opera.

  Related CWE:

  CWE-843

