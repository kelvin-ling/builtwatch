  Sep 9, 2026

  AI Gateway custom costs support cache tokens

  AI Gateway

  AI Gateway custom costs now support cache-read and cache-write token rates. This lets custom cost metrics
  reflect negotiated cache pricing across providers.

  Add

  per_cache_read_token

  or

  per_cache_write_token

  to the

  cf-aig-custom-cost

  header:

  {

  "per_token_in"

  :

  0.000001

  ,

  "per_token_out"

  :

  0.000002

  ,

  "per_cache_read_token"

  :

  0.0000001

  ,

  "per_cache_write_token"

  :

  0.0000005

  }

  Cache-token pricing activates when either cache rate is present. An omitted cache rate defaults to

  per_token_in

  . If both cache rates are omitted, AI Gateway preserves the existing input and output calculation.

  Providers can include cache tokens within input tokens or report them separately. AI Gateway automatically
  accounts for these differences and prevents double-counting.

  For more information, refer to

  Custom costs

  .

  Sep 9, 2026

  Improved iOS tap-to-type experience for Browser Isolation

  Browser Isolation

  Cloudflare One

  Browser Isolation

  has improved the tap-to-type experience for users on iOS devices.

  Previously, Browser Isolation displayed a full-screen overlay with the message

  tap to type

  when users focused a text field. The prompt now appears inline over the focused text field, reducing
  disruption when users enter text in isolated sessions.

  If the focused text field is too small to display the full prompt, Browser Isolation displays a keyboard
  icon in the center of the text field instead.

  iOS users should tap twice to begin entering text. This update applies automatically to Browser Isolation
  sessions on iOS.

  For more information on why this interaction is required, refer to

  iOS limitations

  .

  Sep 9, 2026

  New CASB integration for Zoom

  CASB

  Cloudflare CASB

  now integrates with

  Zoom

  . The integration connects through Cloudflare''s pre-built OAuth application — no manual app setup in
  Zoom is required. After an initial scan, CASB continuously scans your Zoom account to surface new findings
  as your environment changes.

  Zoom is widely used for meetings, webinars, and collaboration. Misconfigurations in account settings,
  meeting security controls, and recording access can expose organizations to data leakage, unauthorized
  access, and compliance risk. Cloudflare CASB ingests Zoom account data via API to surface security findings
  across these areas.

  Key capabilities

  Starting today, security teams can scan for security findings across the following assets:

  Account settings

  — Detect weak password policies, unlocked security controls, and two-factor authentication gaps across
  your Zoom account

  User accounts

  — Identify users not enforcing SSO, accounts with insecure host keys, unverified or inactive users,
  and unsafe overrides of account-level security settings

  Meetings

  — Surface meetings without passwords or waiting rooms, meetings using Personal Meeting IDs (PMIs), and
  meetings with external domain hosts

  Recordings

  — Detect publicly accessible cloud recordings, recordings without passcodes, and weak recording password
  configurations

  Content

  — Identify sensitive information in meeting and recording content via DLP Profile matching

  Learn more

  This

  integration

  is available to all Cloudflare Zero Trust customers today. New customers can sign up and start with
  their first two integrations for free. Existing customers can enable the integration directly in the
  Cloudflare One dashboard under

  Cloud & SaaS findings

  >

  Integrations

  . The integration begins scanning immediately and surfaces findings in the dashboard within minutes.

