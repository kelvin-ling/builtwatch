  Enterprise customers can self-serve CDN upload limits up to 5 GB

  Cloudflare Fundamentals

  Workers

  Enterprise customers can now configure a zone''s CDN

  Maximum Upload Size

  up to 5 GB directly from the

  Network

  page in the Cloudflare dashboard. This removes the need to contact your account team or Cloudflare Support
  when applications need to accept request bodies larger than 500 MB and no greater than 5 GB.

  The default maximum upload size remains 500 MB. Upload limits above 5 GB still require additional configuration
  through your account team or

