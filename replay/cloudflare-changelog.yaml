  Sep 8, 2026

  Miniflare v5 prepares local development for the cf CLI

  Workers

  Miniflare v5 prepares Cloudflare local development tooling for the upcoming

  cf

  CLI.

  Miniflare powers local Workers development behind

  wrangler dev

  , the Cloudflare Vite plugin, and

  @cloudflare/vitest-plugin

  .

  Most projects should use those tools instead of depending on Miniflare directly, and Miniflare v5 will
  not require any action.

  The most significant change is a new configuration shape which aligns Miniflare with

  cloudflare.config.ts

  , the programmatic Cloudflare configuration format now available for testing.

  Other breaking changes include:

  Removed deprecated APIs and options, such as legacy alpha D1 bindings.

  Removed now-unused, internal APIs like

  wrappedBindings

  Removed Miniflare''s built-in module discovery; higher-level tools like Wrangler and the Vite plugin
  should be providing the module graph.

  Moved local-only /cdn-cgi routes under /cdn-cgi/local.

  Replaced per-resource persistence options with shared persistence root options.

  For a more comprehensive list, refer to

  Miniflare''s changelog

  ↗

  This work sets up a cleaner foundation for the next generation of local development tooling, including
  the new

  cf

  CLI.

