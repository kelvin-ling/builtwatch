  WAF Release - 2026-09-10 - Emergency

  WAF

  This update provides immediate defense against a high-severity, actively exploited zero-day vulnerability
  targeting Adobe Commerce and Magento Open Source storefronts.

  Key Findings

  Adobe Commerce and Magento RCE (CVE-2026-75650 / "StyleSmuggler"): Unauthenticated Remote Code Execution
  (RCE) vulnerability caused by improper neutralization of special elements in the platform''s template
  engine. Unauthenticated attackers can inject arbitrary PHP payloads through style properties to execute
  system commands and deploy persistent malware.

  Impact

  This emergency rule provides immediate edge-level mitigation and virtual patching, origin applications
  must be urgently updated. We strongly recommend to apply the hotfix outlined in Adobe Security Bulletin

  APSB26-146

  and immediately rotate all potentially exposed encryption keys, integration tokens, and system credentials,
  as patching alone does not remediate an existing compromise.

