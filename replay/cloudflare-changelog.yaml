  Very large uploads may reach connection or read timeouts before reaching the configured size limit.
  Make sure clients and origins allow enough time to complete the transfer when increasing this setting.

  Refer to

  Cache upload limits

  and

  Workers request body size limits

  for details.

  Sep 4, 2026

  R2 Data Access Logs

  R2

  R2 Data Access Logs are now generally available. Turn on logging for a bucket to record object read,
  write, list, multipart upload, and delete operations with response status codes below

  400

  .

  Data Access Logs cover requests made through the S3-compatible API, Cloudflare API and dashboard, Workers
  bindings, and public buckets through

  r2.dev

  or custom domains. Events are available in Workers Observability, where you can filter by bucket, operation,
  interface, actor, and other request fields.

  Log delivery is asynchronous and best effort. Events may be delayed or omitted, so do not rely on Data
  Access Logs as a complete record of bucket activity.

  Data Access Logs are available for non-jurisdictional buckets. For setup instructions, supported operations,
  and the event field reference, refer to

  R2 Data Access Logs

  .

  Sep 4, 2026

  Deploy larger Workers — up to 64 MiB for both free and paid plans

  Workers

  You can now deploy Workers with larger dependencies, heavier frameworks, and more code without hitting
  size limits.

  When you deploy a Worker, Wrangler bundles your code and compresses it before uploading. Previously,
  Cloudflare checked that compressed size and rejected deploys over 3 MB (Free) or 10 MB (Paid). That
  limit has been removed. Cloudflare now only checks the uncompressed size of your bundle, which is 64
  MiB across all plans.

  To check your Worker''s bundle size before deploying:

  wrangler

  deploy

  --outdir

  bundled/

  --dry-run

  Total

  Upload:

  259.61

  KiB

  /

  gzip:

  47.23

  KiB

  The

  Total Upload

  value is your uncompressed bundle size. This is what counts against the 64 MiB limit. The

  gzip

  value is shown for reference but is no longer a limit.

  For more information, refer to the

  Worker size limits documentation

  .

