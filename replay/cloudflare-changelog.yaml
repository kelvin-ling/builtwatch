  Sep 10, 2026

  Default instance retention for new Workflows on Workers Paid is seven days

  Workflows

  Workflows

  created on or after September 10, 2026, on the Workers Paid plan retain completed and errored instance
  state for seven days by default (previously 30 days). The seven day default helps to reduce storage
  costs by default. The maximum retention

  limit

  remains 30 days.

  The retention period for existing Workflows is unchanged. The Workers Free plan retains its three-day
  default and limit.

  To set the retention period for a Workflow instance, specify

  successRetention

  ,

  errorRetention

  , or both:

  const

  instance

  =

  await

  env.

  MY_WORKFLOW

  .

  create

  ({

  retention: {

  successRetention:

  "2 days"

  ,

  errorRetention:

  "30 days"

  ,

  },

  });

  const

  instance

  =

  await

  env.

  MY_WORKFLOW

  .

  create

  ({

  retention: {

  successRetention:

  "2 days"

  ,

  errorRetention:

  "30 days"

  ,

  },

  });

  You can also set the retention period per Workflow and per instance in the

  Cloudflare dashboard

  ↗

  .

  For retention details, refer to

  Workflows pricing

  and the

  WorkflowInstanceCreateOptions

  API reference

  .

  Sep 10, 2026

  Use Cloudflare Containers with Codex via the OpenAI Agents API

  Containers

  The OpenAI Agents API gives your application access to Codex through an OpenAI-managed API.

  OpenAI manages sessions, orchestration, context compaction, and recovery while your application provides
  tools and uses Cloudflare Containers as the execution environment.

  Cloudflare Containers can now provide self-hosted execution environments for the OpenAI Agents API.
  The open-source

  OpenAI Agents API Workers template

  ↗

  provides a reference implementation. The Worker maintains a Cloudflare Container for each Codex session,
  keeps active work running, reconnects on follow-up input, and shuts down automatically when idle.

  You can configure the reference implementation to meet your needs by extending the Container to provide
  controlled access to data and the network or by integrating it with other Cloudflare products.

  To get started, refer to

  Run Codex on Cloudflare using the OpenAI Agents API

  .

