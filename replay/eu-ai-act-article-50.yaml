  Chapter IV

  Transparency Obligations for Providers and Deployers of Certain AI Systems

  Article 50

  : Transparency Obligations for Providers and Deployers of Certain AI Systems

  Comes into force 2 August 2026, according to

  Article 113

  Related recitals:

