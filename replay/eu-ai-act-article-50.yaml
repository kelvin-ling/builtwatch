  is technically feasible, taking into account the specificities and limitations of various types of content,
  the costs of implementation and the generally acknowledged state of the art, as may be reflected in
  relevant technical standards. This obligation shall not apply to the extent the AI systems perform an
  assistive function for standard editing or do not substantially alter the

  input data

  input data

