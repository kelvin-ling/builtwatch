  1.

  Providers shall ensure that AI systems intended to interact directly with natural persons are designed
  and developed in such a way that the natural persons concerned are informed that they are interacting
  with an

  AI system

  AI system

  means a machine-based system that is designed to operate with varying levels of autonomy and that may
  exhibit adaptiveness after deployment, and that, for explicit or implicit objectives, infers, from the
  input it receives, how to generate outputs such as predictions, content, recommendations, or decisions
  that can influence physical or virtual environments

  Article 3(1)

  , unless this is obvious from the point of view of a natural person who is reasonably well-informed,
  observant and circumspect, taking into account the circumstances and the context of use. This obligation
  shall not apply to AI systems authorised by law to detect, prevent, investigate or prosecute criminal
  offences,

  subject

  subject

  for the purpose of real-world testing, means a natural person who participates in testing in real-world
  conditions

  Article 3(58)

  to appropriate safeguards for the rights and freedoms of third parties, unless those systems are available
  for the public to report a criminal offence.

