  4.

  Deployers of an

  AI system

  AI system

  means a machine-based system that is designed to operate with varying levels of autonomy and that may
  exhibit adaptiveness after deployment, and that, for explicit or implicit objectives, infers, from the
  input it receives, how to generate outputs such as predictions, content, recommendations, or decisions
  that can influence physical or virtual environments

  Article 3(1)

  that generates or manipulates image, audio or video content constituting a

  deep fake

  deep fake

  means AI-generated or manipulated image, audio or video content that resembles existing persons, objects,
  places, entities or events and would falsely appear to a person to be authentic or truthful

  Article 3(60)

  , shall disclose that the content has been artificially generated or manipulated. This obligation shall
  not apply where the use is authorised by law to detect, prevent, investigate or prosecute criminal offence.
  Where the content forms part of an evidently artistic, creative, satirical, fictional or analogous work
  or programme, the transparency obligations set out in this paragraph are limited to disclosure of the
  existence of such generated or manipulated content in an appropriate manner that does not hamper the
  display or enjoyment of the work.

  Deployers of an

  AI system

  AI system

  means a machine-based system that is designed to operate with varying levels of autonomy and that may
  exhibit adaptiveness after deployment, and that, for explicit or implicit objectives, infers, from the
  input it receives, how to generate outputs such as predictions, content, recommendations, or decisions
  that can influence physical or virtual environments

  Article 3(1)

  that generates or manipulates text which is published with the purpose of informing the public on matters
  of public interest shall disclose that the text has been artificially generated or manipulated. This
  obligation shall not apply where the use is authorised by law to detect, prevent, investigate or prosecute
  criminal offences or where the AI-generated content has undergone a process of human review or editorial
  control and where a natural or legal person holds editorial responsibility for the publication of the
  content.

