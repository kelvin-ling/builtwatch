  5.

  The information referred to in paragraphs 1 to 4 shall be provided to the natural persons concerned
  in a clear and distinguishable manner at the latest at the time of the first interaction or exposure.
  The information shall conform to the applicable accessibility requirements.

  6.

  Paragraphs 1 to 4 shall not affect the requirements and obligations set out in Chapter III, and shall
  be without prejudice to other transparency obligations laid down in Union or national law for deployers
  of AI systems.

  7.

  The Commission shall encourage and facilitate the drawing up of codes of practice at Union level to
  facilitate the effective implementation of the obligations regarding the detection, marking and labelling
  of artificially generated or manipulated content. The Commission, taking utmost account of the opinion
  of the Board, shall assess whether adherence to those codes of practice is adequate to ensure compliance
  with the obligations laid down in paragraphs 2 and 4 of this Article, in accordance with the procedure
  laid down in

  Article 56

  (6). If it deems the code of practice to be inadequate, the Commission may adopt an implementing act
  specifying common rules for the implementation of those obligations in accordance with the examination
  procedure laid down in

  Article 98

  (2).

  The

  AI Office

  AI Office

  means the Commission’s function of contributing to the implementation, monitoring and supervision of
  AI systems and general-purpose AI models, and AI governance, provided for in Commission Decision of
  24 January 2024; references in this Regulation to the AI Office shall be construed as references to
  the Commission

  Article 3(47)

  shall encourage and facilitate the drawing up of codes of practice at Union level to facilitate the
