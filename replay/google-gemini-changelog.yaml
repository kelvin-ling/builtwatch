  Release notes

  This page documents updates to the Gemini API.

  September 3, 2026

  Lyria 3.5 in public preview

  : Released the next generation of Google''s music

  generation model:

  lyria-3.5

  :

  Full-length song generation with improved musical coherence, natural vocals,

  and fine-grained duration and structural control.

  The model supports text and image inputs and generates high-fidelity 44.1 kHz

  stereo audio. See the

  Music generation

  guide for details and code samples.

  September 2, 2026

  Gemini 3.8 Flash generally available (GA)

  : Released

  gemini-3.8-flash

  , our most intelligent Flash model, engineered for

  long-horizon software engineering, autonomous agents, and complex enterprise

  workflows.

  To get started, see the

  Gemini 3.8 Flash

  model page and

  the

  Latest model guide

  .

  September 1, 2026

  Agentic video understanding

  : Released agentic video understanding for

  Gemini 3.7 Flash, 3.6 Flash, and 3.5 Flash-Lite across the Interactions and

  GenerateContent APIs. The model dynamically navigates video timelines,

  requesting transcripts, frames, or audio tracks on demand. This approach uses

  up to 88% fewer tokens for long-form content compared to static processing.

  To get started, see the

  Agentic video understanding

  guide.

  August 27, 2026

  Gemini Omni Flash generally available (GA)

  : Released

  gemini-omni-1.1-flash

  , the GA version of our fast, conversational video

  generation and editing model. This release includes significant new

  capabilities:

  Video extension

  : Seamlessly extend existing videos by generating

  continuations at the end of a clip using the

  extend

  task or directly

  with a prompt.

  Interpolation (first + last frame)

  : Generate a video transitioning

  between two images using the

  image_to_video

  task with up to 2 images.

  Resolution control

  : New

  resolution

  parameter in

  video_config

  supports

  360p

  ,

  720p

  (default),

  1080p

  , and

  4k

  outputs.

  1080p and 4K outputs are generated using upscaling.

  The existing

  gemini-omni-flash-preview

  endpoint will be deprecated on

  September 30, 2026.

  To get started, see the

  Gemini Omni Flash

  model page

  and the

  omni guide

  .

  August 26, 2026

  Gemini 3.5 Transcribe generally available (GA)

  : Released two dedicated

  speech-to-text models based on Gemini''s audio understanding:

  Gemini 3.5 Transcribe

  (

  gemini-3.5-transcribe

  ): High-accuracy,

  low-latency non-streaming speech-to-text with utterance-based language

  detection across 85+ languages, speaker diarization, word-level

  timestamps, and custom vocabulary biasing (up to 1,000 terms).

  Gemini 3.5 Transcribe Live

  (

  gemini-3.5-transcribe-live

  ):

  Low-latency, bidirectional streaming speech-to-text over WebSockets using

  the Live API, supporting interim and finalized transcription events,

  Smart transcription mode, and multiple Voice Activity Detection (VAD)

  strategies.

  To get started, see the

  Audio transcription guide

  , the

  Live transcription guide

  , and the

  Gemini 3.5 Transcribe model page

  .

  August 13, 2026

  Gemini 3.7 Flash generally available (GA)

  : Released our most

  intelligent workhorse model yet for coding and agents:

  Gemini 3.7 Flash

  (

  gemini-3.7-flash

  ): Substantial improvements

  across software engineering, web development, and agentic workflows,

  available at an introductory price through December 31, 2026.

  To get started, see the

  Gemini 3.7 Flash

  model page

  and the

  Latest model guide

  .

  July 30, 2026

  Gemini Robotics ER 2 in public preview

  : Released two new embodied

  reasoning model endpoints for robotics:

  gemini-robotics-er-2-preview

  : Advanced spatial reasoning, agentic

  code execution, multi-step tool orchestration, video moment finding,

  progress classification, and multi-robot coordination.

  gemini-robotics-er-2-streaming-preview

  : Optimized for real-time

  text streaming using the Live API, enabling low-latency robot agents with

  bidirectional audio and video input.

  Both model endpoints accept text, image, video, and audio inputs and support

  function calling with blocking behavior for physical robot actions.

  To get started, see the

  Gemini Robotics ER overview

  . For

  real-time streaming use cases, see

  Robotics with streaming

  .

  Deprecation announcement

  : The

  gemini-robotics-er-1.6-preview

  model

  will be

  shut down

  on August 31, 2026.

  July 21, 2026

  Gemini 3.6 Flash and Gemini 3.5 Flash-Lite generally available (GA)

  :

  Released stable, production-ready versions of our latest 3.x Flash models:

  Gemini 3.6 Flash

  (

  gemini-3.6-flash

  ): Features improved token

  efficiency and code/agentic planning capabilities at a lower price point

  than 3.5 Flash, resolving developer feedback around output verbosity.

  Gemini 3.5 Flash-Lite

  (

  gemini-3.5-flash-lite

  ): Offers a

  low-latency, highly cost-effective subagent option designed for

  high-volume automation.

  To learn more, see the

  Latest Gemini model

  guide.

  Deprecated parameters

  : The sampling parameters

  temperature

  ,

  top_p

  and

  top_k

  are now deprecated. See the

  Latest Gemini Model

  for details.

  July 6, 2026

  Developer logs

  support for the

  Interactions API: logs for supported Interactions API calls are now viewable

  in the

  AI Studio dashboard

  .

  June 30, 2026

  Gemini Omni Flash in public preview

  : Released

  gemini-omni-flash-preview

  ,

  a high-performance multimodal model designed for high-speed video generation

  and conversational video editing. Using the

  Interactions API

  ,

  you can generate 3–10 second videos at 720p from text descriptions or animate still images,

  and then conversationally edit and refine the outputs. To get started, see the

  Gemini Omni Flash

  guide and the

  Gemini Omni Flash

  model card.

  Released

  gemini-3.1-flash-lite-image

  (Nano Banana 2 Lite) to general

  availability (GA), our built-in multimodal model optimized for ultra-low

  latency and cost-effective image generation and editing. See the

  Gemini 3.1

  Flash Lite Image

  model

  card and the

  Image generation

  guide.

  June 24, 2026

  Computer Use

  : Launched public preview support for the

  Computer Use

  tool in Gemini 3.5 Flash. This

  release includes simplified actions with intents, built-in support for

  browser, mobile, and desktop environments, configurable safety policies, and

  advanced prompt injection detection.

  June 17, 2026

  Streaming support for speech generation

  : Streaming via

  streamGenerateContent

  (and

  stream: true

  in the Interactions API) is now supported for the

  gemini-3.1-flash-tts-preview

  model. To learn more, see the

  Text-to-Speech

  guide.

  June 15, 2026

  Deprecation announcement

  : The following image generation models are

  being deprecated and will be

  shut down

  on

  August 17, 2026

  :

  Imagen 4 and Gemini 3 Image models

  :

  imagen-4.0-generate-001

  imagen-4.0-ultra-generate-001

  imagen-4.0-fast-generate-001

  To migrate your code to newer stable or preview endpoints, refer to the

  Gemini deprecations

  page.

  Deprecation announcement

  : The following video generation models are

  being deprecated and will be

  shut down

  on

  June 30, 2026

  :

  Veo models

  :

  veo-2.0-generate-001

  veo-3.0-generate-001

  veo-3.0-fast-generate-001

  Update your integration to either use the Veo 3.1 preview model IDs

  (

  veo-3.1-generate-preview

  ,

  veo-3.1-fast-generate-preview

  ) or the

  3.1 GA models available through the

  Gemini Enterprise Agent Platform

  to avoid service interruptions.

  Deprecation announcement

  : The experimental GMP Contextual View tool (a fixed interface for Grounding with Google Maps outputs)
  will

  shut down

  on

  June 15, 2026

  :

  June 1, 2026

  The following Gemini 2.0 models are now

  shut down

  :

  gemini-2.0-flash

  gemini-2.0-flash-001

  gemini-2.0-flash-lite

  gemini-2.0-flash-lite-001

  Use

  gemini-3.5-flash

  or

  gemini-3.1-flash-lite

  instead.

  May 28, 2026

  Released

  gemini-3.1-flash-image

  (Nano Banana 2) and

  gemini-3-pro-image

  (Nano Banana Pro), the generally available (GA) versions of our native

  visual models,

  Gemini 3.1 Flash Image

  and

  Gemini 3 Pro Image

  .

  Video-to-image generation support

  : You can now pass a video file (via

  direct upload or as a public YouTube URL) as multimodal context alongside a

  text prompt to generate high-quality thumbnails, cinematic movie posters, or

  summary infographics. This feature is supported exclusively on the

  gemini-3.1-flash-image

  model. To learn more, see the

  Video-to-image generation

  guide.

  Deprecation announcement: The

  gemini-3.1-flash-image-preview

  and

  gemini-3-pro-image-preview

  models are deprecated

  and will be

  shut down

  on June 25, 2026.

  May 25, 2026

  The

  gemini-3.1-flash-lite-preview

  model has been

  shut down

  . Use

  gemini-3.1-flash-lite

  instead.

  May 19, 2026

  Released

  gemini-3.5-flash

  , the generally available (GA) version of

  Gemini 3.5 Flash

  ,

  our most intelligent model for sustained frontier performance on

  agentic and coding tasks. This is now the model behind

  gemini-flash-latest

  .

  Launched the

  Managed Agents in the Gemini API

  in public preview. This enables

  developers to build and deploy autonomous, stateful agents that run in

  secure, isolated Google-hosted Linux sandbox environments. To learn more,

  see the

  Agents overview

  page and the

  Quickstart

  .

  Released the general-purpose

  Antigravity Agent

  managed agent,

  antigravity-preview-05-2026

  , in public preview.

  The Antigravity agent can autonomously plan, reason, write and execute code,

  manage files, and browse the web inside its sandbox container. See the

  Antigravity Agent

  guide for code

  samples and specifications.

  May 7, 2026

  Released

  gemini-3.1-flash-lite

  , the generally available (GA) version of

  Gemini 3.1 Flash-Lite

  ,

  optimized for speed, scale, and cost efficiency.

  Deprecation announcement: The

  gemini-3.1-flash-lite-preview

  model is

  deprecating on 5/11/26 and will be

  shut down

  on May 25, 2026.

  May 6, 2026

  Upcoming breaking change

  : The

  Interactions API

  request and response schema (

  outputs

  →

  steps

  ) and output format

  configuration (

  response_format

  ) are changing. The new schema becomes the

  default on

  May 26

  and the legacy schema will be removed on

  June 8

  .

  See the

  migration guide

  for details.

  May 5, 2026

  Updated

  File Search

  to support multimodal search. You can now natively

  embed and search through images using the

  gemini-embedding-2

  model.

  Grounding metadata now includes

  media_id

  for visual citations and

  page_numbers

  that indicate where information is found. To learn

  more, see the

  File Search

  guide.

  May 4, 2026

  Launched event-driven

  Webhooks

  support in the

  Gemini API to replace polling workflows for the Batch API and long-running

  operations.

