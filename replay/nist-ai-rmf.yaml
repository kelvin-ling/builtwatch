  AI Risk Management Framework

  On April 7, 2026, NIST released a concept note for an

  AI RMF Profile on Trustworthy AI in Critical Infrastructure

  . The profile will guide critical infrastructure operators towards specific risk management practices
  to consider when engaging AI-enabled capabilities.

