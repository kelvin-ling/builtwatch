  September, 2026

  Sep 10

  Feature

  You can now set expiration dates when creating project API keys. Administrators can also enforce a maximum
  key lifetime at the organization or project level in Platform settings, requiring newly created keys
  to expire within the configured limit. See

  production best practices

  for guidance on key expiration and rotation.

  Sep 10

  Feature

  Released the

  Agents API

  in public beta. Build agents with a managed Codex harness while OpenAI handles session orchestration,
  context compaction, and recovery.

  Use durable sessions to continue work across turns, stream progress, and connect your own tools and
  MCP servers. Run agents in OpenAI-hosted sandboxes or connect a sandbox from your own infrastructure
  or a supported provider.

  Start with the

  Agents API quickstart

  .

  Sep 10

  Feature

  gpt-live-1

  v1/live/sessions

  GPT-Live 1

  is now generally available in the API. Build full-duplex voice conversations that can continue while
  a backend model or agent handles reasoning and tools.

  Use Responses delegation with an OpenAI model, or client delegation to connect your own backend. Voice
  sessions cost $0.05 per minute, billed per second; backend model and tool usage is charged separately.

  Start with

  GPT-Live

  ,

  prompting

  , and

  migration guidance

  . See

  pricing

  for details.

  Sep 8

  Feature

  v1/responses

  Prompt Cache Diagnostics

  is now generally available in the Responses API for GPT-5.6 and later supported models.

  Compare cache reuse against a previous response, identify reasons for cache misses, and follow troubleshooting
  guidance to improve cache reuse.

  Sep 8

  Feature

  gpt-image-2.5-sunburst

  gpt-image-2.5-flare

  v1/images

  v1/responses

  Released

  GPT Image 2.5 Sunburst

  and

  GPT Image 2.5 Flare

  for image generation and editing through the Image API and the Responses API image generation tool.

  Use Sunburst for workflows where editing precision matters most, or Flare for fast, high-quality everyday
  image generation. Both models support the new

  xhigh

  and

  max

  quality settings and use GPT Image 2 token rates. See the

  image generation guide

  and

  pricing

  .

  Sep 8

  Feature

  gpt-rosalind-research

  GPT-Rosalind (

  gpt-rosalind-research

  ) is now generally available through the

  trusted-access program

  for approved internal life sciences research.

  Standard pricing is $5 per 1M input tokens, $0.50 per 1M cached input tokens, and $25 per 1M output
  tokens. Billing begins on October 5, 2026. See

  pricing

  for details.

  Sep 3

  Feature

  gpt-6-astra

  v1/responses

  v1/chat/completions

  Released

  GPT-6 Astra

  , our most capable model, built for the hardest end-to-end work.

  Use GPT-6 Astra for reasoning, coding, computer use, research, and document creation. It combines these
  capabilities to carry complex tasks from an initial request to a finished result, using the context
  and tools you provide.

  Key changes to consider when migrating:

  GPT-6 Astra does not support the

  none

  reasoning effort level.

  GPT-6 Astra does not support custom

  temperature

  or

  top_p

  values or log probabilities (

  logprobs

  ).

  Tool calling requires the Responses API. If you use tools with Chat Completions, follow the

  Responses migration guide

  .

  Misalignment monitoring

  asynchronously checks for potential issues during agent work in supported Responses API requests. Checks
  can trigger safety alerts or stop a conversation for review.

  Start with

  Using GPT-6 Astra

  for capabilities, prompting, and migration guidance. Explore

  computer use

  for browser and desktop workflows, and see

  pricing

  for available inference tiers.

  Sep 3

  Feature

  v1/responses

  Added new controls for long-running work with GPT-6 Astra in the Responses API:

  Async tool calling

  : Let the model continue working while your application runs function or custom tools, then return results
  as they become available.

  Mid-turn steering

  : Send additional instructions while a response is in progress over WebSockets, so the model can incorporate
  corrections or changing requirements.

  Change reasoning effort mid-conversation

  : Increase effort for difficult work or reduce it for routine follow-ups while preserving the cached
  prompt prefix.

  Sep 2

  Update

  Updated API errors so applications can distinguish traffic that increases too quickly from temporary
  model overload.

  Traffic that increases too quickly can return a

  429

  error with the

  slow_down

  code. Temporary model overload returns a

  503

  error with the

  server_is_overloaded

  code. Both responses may include

  Retry-After

  . When the header is present, wait at least as long as it specifies before retrying. If it''s missing,
  use exponential backoff. See the

  error codes guide

  and

  rate limits guide

  .

  Sep 1

  Update

  Connections to

  api.openai.com

  can now use IPv6.

  August, 2026

  Aug 29

  Feature

  Mutual TLS (mTLS)

  and

  X.509 workload identity federation

  are now generally available for the OpenAI API. Configure certificates and X.509 identity providers
  directly in the

  Platform console

  , with access controlled by your organization''s roles and permissions.

  Aug 26

  Update

  whisper-1

  gpt-4o-transcribe

  gpt-4o-mini-transcribe

  gpt-4o-transcribe-diarize

  v1/audio/transcriptions

  v1/realtime

  Announced the deprecation of

  whisper-1

  ,

  gpt-4o-transcribe

  ,

  gpt-4o-mini-transcribe

  , and

  gpt-4o-transcribe-diarize

  . These models will shut down on February 26, 2027. Migrate to

  gpt-live-transcribe

  or

  gpt-transcribe

  . See the

  transcription guide

  and

  deprecations page

  .

  The Assistants API shut down on August 26, 2026. Migrate to the Responses API and Conversations API
  using the

  migration guide

  .

  Aug 21

  Feature

  API customers can now select regional processing for an individual request by using a prefixed domain
  with an API key from a project having Global geography. Existing eligibility, data retention control,
  endpoint, and model support requirements continue to apply. Learn more in the

  data controls guide

  .

  Aug 21

  Update

  gpt-5.6-sol

  GPT-5.6 Sol now costs $4 per million input tokens and $20 per million output tokens, representing 20%
  lower input pricing and 33% lower output pricing. GPT-5.6 Sol’s promotional pricing is available at
  least through November 21, 2026. See

  pricing details

  .

  Aug 20

  Feature

  Released the

  Prompt Caching dashboard

  on the OpenAI API platform. Track your cache hit rate over time, cache reads per write, and the breakdown
  of cache-read, cache-write, and uncached tokens to understand your caching efficiency and identify opportunities
  to improve. Filter metrics by model and service tier.

  Aug 20

  Update

  gpt-image-2

  gpt-image-2-2026-04-21

  v1/images/generations

  v1/images/edits

  v1/responses

  Transparent backgrounds are now available in preview for

  gpt-image-2

  and

  gpt-image-2-2026-04-21

  in the Images API and the Responses API image generation tool. Set

  background

  to

  transparent

  and use

  png

  or

  webp

  output;

  jpeg

  does not support transparent backgrounds. Learn more in the

  image generation guide

  .

  Aug 13

  Announcement

  Announced Ultrafast mode, a new API service tier for GPT-5.6 Sol that runs up to 14x faster than Standard
  processing. Available in limited preview to select customers. Sign up to receive updates on Ultrafast
  mode

  here

  .

  Aug 7

  Feature

  gpt-5.6-cyber

  gpt-daybreak-red-latest

  gpt-daybreak-blue-latest

  v1/responses

  Daybreak now offers two access tiers for approved defenders: Daybreak Blue and Daybreak Red. Use them
  to move from security findings to validated fixes in explicitly authorized engagements.

  Start with Daybreak Blue for most defensive security work. It provides access to general-purpose models
  such as GPT-5.6 Sol for vulnerability discovery, secure code review, detection engineering, incident
  response, malware analysis, and patch validation. Read more

  here

  .

  Daybreak Red provides separately approved access to purpose-trained models such as

  GPT-5.6 Cyber

  for authorized vulnerability reproduction, exploit validation, penetration testing, red teaming, and
  complex system analysis.

  These models require separate approval and provisioning. You can apply to join the Daybreak program

  here

  . More details on pricing

  here

  .

  Aug 6

  Update

  chat-latest

  Updated the

  chat-latest

  snapshot, which points to the latest model available in ChatGPT for Plus and Pro users. We recommend
  leveraging

  GPT-5.6 Sol

  for production API usage, but feel free to use this model to test the latest improvements for chat use
  cases. The underlying model snapshot will be regularly updated. Read more

  here

  .

  Aug 5

  Update

  gpt-5.6-sol

  gpt-5.6-terra

  gpt-5.6-luna

  Fast mode now supports long-context requests for GPT-5.6 Sol, GPT-5.6 Terra, and GPT-5.6 Luna. As of
  today, long-context prompts exceeding 272K tokens can run in

  Fast mode

  , delivering speeds up to 2.5× faster than the Standard tier. See

  pricing details

  .

  Aug 4

  Feature

  Customers can now filter and group data by API key in the

  Usage and Costs dashboards

  . The

  Usage API

  and

  Costs API

  also support the API key dimension for programmatic reporting and analysis.

  July, 2026

  Jul 30

  Update

  gpt-5.6-sol

  gpt-5.6-terra

  gpt-5.6-luna

  v1/responses

  v1/chat/completions

  Starting July 30, GPT-5.6 Luna costs 80% less, while GPT-5.6 Terra costs 20% less. See

  pricing details

  .

  We''re also introducing

  Fast mode

  in the API, which replaces our Priority Processing offering. For GPT-5.6 Sol, Fast mode now delivers
  up to 2.5× faster speeds than standard processing at twice the price. This change is backward compatible:
  requests tagged priority will automatically use Fast mode.

  Jul 29

  Feature

  Released the official

  OpenAI Terraform provider

  for managing OpenAI API Platform resources as infrastructure as code.

  Provision and manage projects, users, groups, roles, access assignments, service accounts, certificates,
  invitations, and project-level rate limits. Use standard Terraform workflows to review and apply changes,
  import existing resources, and detect and reconcile configuration drift. Install the provider from the

  Terraform Registry

  .

  Jul 28

  Feature

  gpt-transcribe

  gpt-live-transcribe

  v1/audio/transcriptions

  v1/realtime

  Released

  GPT Transcribe

  for accurate file transcription and final transcripts of committed Realtime turns, along with

  GPT Live Transcribe

  for low-latency streaming transcription.

  Both models support free-form transcription context, keyword hints, and multiple expected input languages.
  Compare supported outputs and workflows in the

  transcription guide

  .

  Jul 22

  Feature

  Added hard spend limits for organizations and projects on the OpenAI API platform. Set a monthly cap
  that causes affected API requests to return a

  429

  error when tracked spend reaches the limit. Use spend alerts for notification before traffic is interrupted.
  Read more in the

  spend limits guide

  .

  Jul 9

  Feature

  gpt-5.6-sol

  gpt-5.6-terra

  gpt-5.6-luna

  v1/responses

  v1/chat/completions

  v1/batch

  Released the

  GPT-5.6 model family

  , including GPT-5.6 Sol for frontier capability, GPT-5.6 Terra for a balance of intelligence and cost,
  and GPT-5.6 Luna for efficient, high-volume workloads. The

  gpt-5.6

  alias routes requests to

  gpt-5.6-sol

  .

  GPT-5.6 adds

  Programmatic Tool Calling

  ,

  explicit prompt caching controls

  ,

  persisted reasoning,

  max

  reasoning effort, and Pro mode

  , and

  Multi-agent orchestration in beta for the Responses API

  . GPT-5.6 also accepts images at their original dimensions with

  original

  or

  auto

  image detail.

  Jul 6

  Feature

  gpt-realtime-2.1

  gpt-realtime-2.1-mini

  v1/realtime

  Released

  GPT-Realtime-2.1

  , an updated realtime reasoning model with improved alphanumeric recognition, silence and noise handling,
  and interruption behavior. Also released

  GPT-Realtime-2.1 mini

  , a faster, lower-cost distilled reasoning model for realtime voice applications.

  June, 2026

  Jun 24

  Update

  chat-latest

  Updated the

  chat-latest

  snapshot, which points to the latest Instant model currently used in ChatGPT. We recommend leveraging

  GPT-5.5

  for production API usage, but feel free to use this model to test the latest improvements for chat use
  cases. The underlying model snapshot will be regularly updated. Read more

  here

  .

  Jun 23

  Feature

  Released the Safety Usage Dashboard on the OpenAI API platform. The Safety dashboard shows blocked Responses
  requests based on

  safety_identifier

  values sent on requests to identify end users. Visit the

  Safety dashboard

  .

  Jun 9

  Feature

  v1/responses

  Web search can now return image results alongside regular text results. Use image search when your application
  needs current or web-grounded visuals, such as product photos, landmarks, places, events, or visual
  references. Read more in the

  web search guide

  .

  Jun 5

  Update

