  GA

  Elastic SIP trunking

  Voice API

  International Call Forwarding  - Compliance Blocking for Spain & France

  In Spain and France, an incoming call intended for a non-Spanish or non-French destination that is then
  forwarded internationally while presenting a Spanish or French domestic caller ID is now blocked, in
  line with local regulatory requirements.

