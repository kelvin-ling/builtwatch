  Aug 12, 2026

  Messaging

  GA

  Consent Management API Now Supports Toll-Free Network-Level Opt-Out Overrides

  Customers can now use the Consent Management API to programmatically re-opt-in users on US and Canada
  Toll-Free numbers.

  Previously, opt-outs on US/CA Toll free numbers were strictly enforced at the network level, meaning
  an opt out block could only be lifted if the user texted an opt-in keyword like "START". Now, if a user
  provides valid re-opt-in consent outside of a messaging channel (e.g., via a web form, email, or in-app
  preference center), you can log their updated consent directly through the Consent Management API. Twilio
  will automatically pass this signal to downstream networks to clear the opt-out block and resume messaging.

  Key Highlights:

  Programmatic Re-Opt-In: Seamlessly restore message deliverability for users who re-consent via external
  channels.

  Fewer Failed Sends: Eliminate

  21610

  (Unsubscribed Recipient) and

  30004

  (Message Blocked) error codes for users who have re-consented to receive messages.

  Centralized Compliance: Keep your Twilio messaging traffic perfectly synced with your CRM and internal
  omnichannel engagement and consent workflows.

  For more information, see our

  Consent Management API docs

  .

  Learn more

  Aug 12, 2026

  Twilio end-user certificates for all REST API endpoints will be rotated on September 9, 2026

  On September 9, 2026, Twilio will rotate the end-user TLS certificate for all REST API endpoints. Only
  the end-user certificate and certificate serial number will be renewed; root and intermediate certificates
  will remain the same.

  This is a routine update that won’t impact most customers unless they’re pinning certificates or are
  managing them manually. Customers using the

  Twilio Helper Libraries

  don’t need to take any action since the change will be handled automatically.

  Twilio recommends against certificate pinning because it creates potential security risks, can cause
  downtimes for services, and a higher probability of failed API requests.

  How to test your connection

  The new certificate will be available for testing at https://tls-test.twilio.com starting August 12,
  2026. If the request succeeds with a 200 OK, no further action is required.

  Need a hand?

  These resources have more detail:

  Monitoring Updates to Twilio REST API Security Settings

  Security best practices

  Learn more

  Aug 06, 2026

  GA

  Twilio Email

  Dedicated IPs and IP Management for Twilio Email

  Dedicated IPs are now available for Twilio Email, enabling streamlined control over email deliverability
  directly within the Twilio console. This functionality simplifies sending reputation management at scale.

  To ensure deliverability from day one, newly provisioned dedicated IPs automatically enter a 41-day
  warm-up schedule, complete with shared pool overflow protection to smooth out volume spikes. Organizations
  can also segment traffic by grouping IPs into custom pools, assigning specific IPs directly to sub-accounts,
  and configuring flexible fallback options to maintain continuous email flow.

  To learn more about how to manage your email reputation and IP warmup, see the

  Twilio Docs

  .

