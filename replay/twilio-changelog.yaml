  Aug 13, 2026

  Functions Classic is being deprecated and existing Functions (Classic) are moving to the new Functions

  Twilio is retiring Functions Classic and automatically migrating all accounts to the new Functions.
  No action is required from customers.

  What''s changing with Twilio Functions

  Starting September 13, 2026, customers won’t be able to create new Functions (Classic) and assets. Existing
  Functions (Classic) and assets will continue running, and customers can still edit and deploy existing
  code during this window.

  Between September 14 and October 26, 2026, Twilio will migrate all active Functions (Classic), existing
  URLs, function and asset names, environment variables, and deployed code to the new Functions.

  Need a hand?

